<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eddie &hearts; Gustav | Between Us</title>
<style>
:root{--bg:#fff8f4;--card:#fffdfb;--ink:#472c35;--muted:#8c7279;--accent:#93475e;--accent2:#efd8dd;--line:#ead9da;--shadow:0 18px 55px rgba(98,49,64,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#ffe9e5 0,#fff8f4 38%,#f9eeee 100%);color:var(--ink)}
.wrap{width:min(760px,92%);margin:auto;padding:35px 0 45px}.hero{text-align:center}.hero h1{font:700 clamp(32px,7vw,55px) Georgia,serif;margin:0;color:#71394b}.hero p{color:var(--muted);margin:8px 0 20px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0 22px}.pill,button,select{font:inherit}.pill{border:1px solid var(--line);background:#ffffffaa;padding:8px 11px;border-radius:999px;color:#725764;font-size:13px}.card{position:relative;min-height:365px;padding:35px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,var(--card),#fff4f2);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden}.card:before{content:"♡";position:absolute;font:170px Georgia;color:#9b53630a;right:-12px;bottom:-50px}.category{text-transform:uppercase;letter-spacing:2.2px;font-weight:800;font-size:12px;color:#a1556a}.question{font:600 clamp(25px,5.5vw,37px)/1.25 Georgia,serif;margin:24px auto;max-width:620px}.hint{display:none;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px 18px;margin:0 auto 5px;max-width:570px;line-height:1.55;color:#684c55}.hint strong{color:#8b4056}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}button{border:0;border-radius:999px;padding:14px 16px;cursor:pointer;font-weight:800}.primary{background:var(--accent);color:white}.secondary{background:var(--accent2);color:#69374a}.ghost{background:#fff;border:1px solid var(--line);color:#654956}.filter{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:14px}select{padding:9px 13px;border-radius:999px;border:1px solid var(--line);color:#62434d;background:white}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}.progress{height:5px;background:#eadadd;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;width:0;background:#a65068;transition:.25s}.fade{animation:fade .28s ease}@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}button:focus-visible,select:focus-visible{outline:3px solid #ce8ca0;outline-offset:2px}@media(max-width:520px){.wrap{padding-top:22px}.card{min-height:390px;padding:27px 20px}.controls{grid-template-columns:1fr}.question{font-size:27px}}
@media(prefers-color-scheme:dark){:root{--bg:#251a1e;--card:#332329;--ink:#fff3f5;--muted:#ccb4bb;--accent:#d87e99;--accent2:#543743;--line:#5c4048;--shadow:0 18px 55px #0005}body{background:radial-gradient(circle at top,#4a2c36,#251a1e 55%)}.hero h1{color:#ffd6df}.card{background:linear-gradient(145deg,#39262d,#2d2025)}.hint,.ghost,select{background:#2c2024;color:#fbeef1}.secondary{color:#ffeef3}.pill{background:#ffffff0d}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>Eddie ♥ Gustav</h1><p>Between Us ♡ · A date-night deck for two people getting closer.</p></section>
<div class="toolbar"><span class="pill" id="counter">Card 1</span><span class="pill" id="remaining">Questions left: 0</span></div>
<div class="filter"><label for="categoryFilter">Deck:</label><select id="categoryFilter"><option value="All">All Questions</option></select></div>
<section class="card" id="card" aria-live="polite"><div class="category" id="category"></div><div class="question" id="question"></div><div class="hint" id="hint"></div></section>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button class="secondary" id="hintBtn">💭 Need inspiration?</button><button class="primary" id="nextBtn">Next Card →</button><button class="ghost" id="skipBtn">Skip this one</button><button class="ghost" id="restartBtn">↻ Restart deck</button></div>
<div class="footer">Take turns answering. Skip anything that feels too personal. There are no right answers.</div>
</main>
<script>
const seeds={
"Warm Up":["What is one tiny thing that made you smile this week?","What would your perfect lazy Sunday look like?","What food could you happily eat every week?","What song instantly improves your mood?","What is a harmless opinion you will defend forever?","What is your favorite way to spend an unexpected free afternoon?","What is something you are surprisingly good at?","What is a place you would revisit tomorrow?","What smell brings back a good memory?","What is your comfort movie or show?","What is something silly that always makes you laugh?","What was your favorite childhood snack?","Are you more sunrise or sunset? Why?","What is the best spontaneous thing you have done?","What hobby would you try if time and money were no issue?","What is your ideal breakfast?","What small luxury do you really appreciate?","Which season feels most like you?","What would your perfect cozy evening include?","What is a random fact about you people rarely guess?"],
"Getting to Know You":["What do you wish people understood about you sooner?","What makes you feel most like yourself?","What are you most curious about lately?","What kind of people bring out your best side?","What is something you value more now than five years ago?","What is a quality you are proud of in yourself?","What is something you are currently trying to improve?","When do you feel most confident?","What kind of environment helps you feel peaceful?","What is one thing you never get bored talking about?","What is a memory that captures your personality well?","What does a really good day look like for you?","Are you someone who plans ahead or figures things out as you go?","What is something you take seriously that others may not?","What makes you feel understood?","What do you do when you need to recharge?","Who has influenced the person you are today?","What lesson did you learn later than you wish you had?","What is one part of your personality you have learned to appreciate?","What do your closest friends know about you that acquaintances usually do not?"],
"Life":["What does a successful life mean to you personally?","What matters more to you: stability, freedom, achievement, or something else?","What experience has changed your perspective on life?","What would you do differently if you worried less about other people's opinions?","What are you most grateful for in your life right now?","What is a risk you are glad you took?","What is something you hope never becomes unimportant to you?","How do you know when it is time to let something go?","What does balance look like in your life?","What do you want more room for in your life?","What do you want less of in your life?","What does home mean to you?","What makes life feel meaningful for you?","What is an ordinary moment you hope you never take for granted?","If you could give your younger self one piece of advice, what would it be?","What belief guides a lot of your decisions?","What does being a good person mean to you?","What is something difficult that ultimately helped you grow?","When do you feel most present?","If your life had chapters, what would you call the chapter you are in now?"],
"Love & Dating":["What makes you feel most appreciated by someone you are dating?","What makes a date memorable for you?","What is something small a partner can do that means a lot to you?","What does romance mean to you?","How do you usually show someone that you care?","What makes you feel emotionally close to someone?","What makes chemistry feel different from simple attraction?","What is the sweetest thing someone has done for you?","What helps you trust someone you are dating?","What makes you excited to see someone again?","How important is quality time to you in dating?","What kind of affection comes most naturally to you?","What does consistency look like to you when dating?","What would make you feel chosen in a relationship?","What is one dating expectation you think should be talked about openly?","What does taking things at the right pace mean to you?","When you like someone, how does your behavior change?","What makes someone emotionally attractive to you?","What is something you think couples should keep doing even after years together?","What is your favorite kind of simple date?"],
"Relationships":["What helps you feel safe enough to open up to someone?","How would you like disagreements to be handled in a relationship?","What does trust look like in everyday behavior?","What boundary is especially important to you?","How do you prefer someone to support you when you are stressed?","How important is independence inside a relationship?","What does healthy communication mean to you?","When you are upset, do you prefer space first or conversation first?","What is something partners should never stop being curious about?","What does commitment mean to you?","How do you usually repair things after a misunderstanding?","What makes an apology feel sincere to you?","How should two people deal with having different priorities sometimes?","What role should friendship have in a romantic relationship?","What does emotional availability mean to you?","How do you like to receive reassurance?","What relationship habit do you think keeps people connected?","What is a green flag you notice quickly?","What is something you need in order to feel respected?","How do you think couples can grow without growing apart?"],
"Deep":["What fear has taught you something important about yourself?","What is difficult for you to ask other people for?","When do you find it hardest to be vulnerable?","What are you still learning to forgive yourself for?","What experience made you stronger without you realizing it at the time?","What do you need when life feels overwhelming?","What is something you have changed your mind about in recent years?","What part of growing up surprised you most?","What makes you feel emotionally safe?","What is something you are learning to accept?","What kind of goodbye is hardest for you?","When have you felt especially proud of the way you handled something difficult?","What is one insecurity you have become gentler with?","What does courage look like in ordinary life?","What is something you rarely say out loud but think about often?","When do you feel most understood by another person?","What have past relationships or friendships taught you about yourself?","What does healing mean to you?","What is something you want to become better at communicating?","What part of yourself are you protecting when you pull away from people?"],
"Future":["Where would you love to travel with someone you care about?","What kind of everyday life do you hope to have in five years?","Would you rather live in a busy city, a quiet town, or somewhere surrounded by nature?","What is a dream you have not given up on?","What would you love to learn someday?","What does financial security mean to you personally?","What kind of home would make you happiest?","How important is travel in the life you imagine?","What traditions would you like to create with a partner?","What do you hope future-you thanks you for?","What is one experience you absolutely want to have?","How do you imagine balancing career and personal life?","What kind of community do you want around you?","What is something you want to build or create in your lifetime?","What would an ideal ordinary weekday look like in your future?","How important is living near family or close friends to you?","What is one future milestone you are genuinely excited about?","What would make you feel that you had lived fully?","What kind of adventures do you want more of?","If we could wake up anywhere tomorrow for a spontaneous date, where would you choose?"],
"Flirty":["What was something about me that first caught your attention?","What is something about my personality you find attractive?","What kind of compliment means the most to you?","What is your favorite moment we have had together so far?","What do you think makes two people have great chemistry?","What is something cute you have noticed about me?","What kind of date would make you think about it for days afterward?","What is an unexpectedly attractive quality in someone?","What makes someone charming to you?","What is something you were curious about before our first date?","What is your favorite kind of romantic gesture?","What is one thing you would love for us to do together?","What makes eye contact feel special with someone?","What is something about our conversations you enjoy?","If you planned our next date with no limitations, what would you plan?","What little thing can make a moment feel romantic?","What is a compliment you have wanted to give me?","What do you think we have in common that makes us click?","When have I made you laugh the hardest?","What is one word you would use to describe our vibe so far?"],
"Wild Card":["Both answer: what are you most grateful for today?","Guess the other person's dream holiday, then let them reveal the answer.","Both choose one song that the other person should hear.","Ask each other a question you have been curious about but have not found the right moment to ask.","Give each other one genuine compliment that is not about appearance.","Both describe your perfect date using only three ingredients.","Tell a funny story the other person has not heard yet.","Each name one place you would love to explore together.","Take turns naming three things that make you feel peaceful.","Both answer in five seconds: beach, mountains, city, or countryside? Why?","Describe the other person's energy in three kind words.","Each choose one new thing you would be willing to try together.","Tell each other about one tiny moment from today you enjoyed.","Ask a completely spontaneous question. No overthinking.","Both say one thing you are looking forward to this month.","Each pick a fictional world you would visit together.","Both answer: what makes a conversation unforgettable?","Tell each other your current favorite song and why.","Each suggest one simple future date idea.","Pause the questions and simply talk about whatever answer has surprised you most tonight."]};
const hints={"Warm Up":"Keep it light and specific. A tiny story is usually more fun than a one-word answer.","Getting to Know You":"Give an example from your real life, then explain why it matters to you.","Life":"There is no ideal answer. Talk about the values underneath your choice.","Love & Dating":"Focus on what makes you personally feel cared for rather than what relationships are 'supposed' to look like.","Relationships":"Describe what healthy behavior would look or feel like for you in a real situation.","Deep":"Share only what feels comfortable. You can explain the lesson without revealing anything you would rather keep private.","Future":"Imagine the everyday details, not only the big milestones. What would that future actually feel like?","Flirty":"Be genuine and warm. A specific detail or shared memory makes the answer feel much more personal.","Wild Card":"Do it together. The point is playfulness, not getting the answer perfect."};
let all=[];Object.entries(seeds).forEach(([cat,qs])=>qs.forEach(q=>all.push({cat,q,h:hints[cat]})));
// Create additional original variations so the deck contains 300+ playable cards.
const frames=["Why is this important to you?","Has your answer to this changed over time?","What is a real moment that illustrates your answer?","What would your closest friend guess your answer is?","What would your ideal version of this look like?"];
const prompts=[
["Getting to Know You","What quality makes you feel instantly comfortable around a person?"],["Life","What is something you want to make more time for?"],["Love & Dating","What helps affection feel genuine to you?"],["Relationships","What makes you feel listened to during an important conversation?"],["Deep","What lesson about yourself are you still learning?"],["Future","What part of your future are you most curious to discover?"],["Flirty","What kind of moment makes a date feel unexpectedly special?"]];
prompts.forEach(([cat,p])=>frames.forEach(f=>all.push({cat,q:p+" "+f,h:hints[cat]})));
const extras=["What makes you feel lucky lately?","What memory always gives you a warm feeling?","What is something beautiful you noticed recently?","What personal tradition would you never want to lose?","What does being emotionally mature mean to you?","What motivates you when nobody is watching?","What makes a person easy for you to talk to?","What is something you hope to stay curious about forever?","What kind of support makes the biggest difference to you?","What is one thing you hope a future partner always understands about you?","What does peaceful love look like to you?","What makes you feel genuinely celebrated by another person?","What does being a team mean in a relationship?","How do you prefer to make big decisions with someone?","What kind of memory would you love us to make someday?","What is one adventure that feels very 'you'?","What would make the next year meaningful to you?","What do you hope never changes about your personality?","What makes a conversation feel intimate without being romantic?","What makes someone unforgettable to you?"];
extras.forEach((q,i)=>{const cats=["Life","Getting to Know You","Relationships","Future","Deep"];const cat=cats[i%cats.length];all.push({cat,q,h:hints[cat]})});
// Expand to 320 using reflective follow-up cards built from the curated deck.
let source=[...all],i=0;while(all.length<320){const s=source[i%source.length];const suffix=["What makes you say that?","Can you think of a specific example?","How has that shaped you?","What would make that even better?"][i%4];all.push({cat:s.cat,q:s.q+" "+suffix,h:s.h});i++}
const filter=document.getElementById('categoryFilter');[...new Set(all.map(x=>x.cat))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;filter.appendChild(o)});
let deck=[],cardNo=0,current=null;const $=id=>document.getElementById(id);
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){const c=filter.value;deck=shuffled(all.filter(x=>c==='All'||x.cat===c));cardNo=0;next()}
function next(){if(!deck.length){reset();return}current=deck.pop();cardNo++;$('category').textContent=current.cat;$('question').textContent=current.q;$('hint').innerHTML='<strong>Need inspiration?</strong><br>'+current.h;$('hint').style.display='none';$('counter').textContent='Card '+cardNo;$('remaining').textContent='Questions left: '+deck.length;$('bar').style.width=Math.min(100,(cardNo/(cardNo+deck.length))*100)+'%';$('card').classList.remove('fade');void $('card').offsetWidth;$('card').classList.add('fade')}
$('hintBtn').addEventListener('click',()=>{$('hint').style.display=$('hint').style.display==='block'?'none':'block'});$('nextBtn').addEventListener('click',next);$('skipBtn').addEventListener('click',next);$('restartBtn').addEventListener('click',reset);filter.addEventListener('change',reset);reset();
</script>
</body>
</html>
